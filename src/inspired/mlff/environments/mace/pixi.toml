[workspace]
name = "inspired-mace"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
phonopy = "==2.28.0"
seekpath = "*"

[pypi-dependencies]
mace-torch = ">=0.3.10,<0.4"
torch = { version = "==2.7.1", index = "https://download.pytorch.org/whl/cpu" }

[activation.env]
OMP_NUM_THREADS = "1"
