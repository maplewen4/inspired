[workspace]
name = "inspired-orb"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
phonopy = "==2.28.0"
seekpath = "*"
# cached-path's boto3 dependency currently requires dateutil < 3.
python-dateutil = ">=2.8,<3"

[pypi-dependencies]
orb-models = "==0.5.5"
torch = { version = "==2.7.1", index = "https://download.pytorch.org/whl/cpu" }

[activation.env]
OMP_NUM_THREADS = "1"
